[package]
name = "moduwu-design"
version = "2.1.0"
edition = "2021"
rust-version = "1.92.0"
authors = ["Duecki <dueckis@dueckis.de>"]
license = "GPL-3.0-or-later"
readme = "README.md"
description = "Moduwu Design: reusable egui themes, controls, and responsive layout primitives"

[dependencies]
egui = "0.35"

[dev-dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[[example]]
name = "gallery"
test = true
